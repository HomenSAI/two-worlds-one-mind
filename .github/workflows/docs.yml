name: docs

# Checks and build of the book. Read-only: this workflow can neither push nor publish.
on:
  push:
    branches: [main, "edition-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: two-worlds-one-mind-build:1

jobs:
  checks:
    # citation metadata and version, links and anchors (EN/DE), SVG, every Mermaid block,
    # the worked example, Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned tool image
        run: docker build -t "$IMAGE" .
      - name: Run all checks
        run: ./scripts/check.sh

  build:
    # complete books (PDF + self-contained HTML, EN and DE), SHA-256 sums, manifest, artifact check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned tool image
        run: docker build -t "$IMAGE" .
      - name: Build the books and check the artifacts
        run: ./scripts/build.sh
      # Test artifacts only (kept for 14 days). Publishing a release is a separate, manual workflow.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-preview-${{ github.sha }}
          path: |
            dist/*.pdf
            dist/*.html
            dist/SHA256SUMS
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
