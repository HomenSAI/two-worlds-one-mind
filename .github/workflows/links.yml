name: external-links

# Periodic / manual check of external links. Separate from docs.yml so that somebody else's site being
# slow never blocks an edit of the book. Only a real 404/410 fails; timeouts, 429 and refusals of
# automatic access are printed as warnings (see scripts/check_external_links.py).
on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check external links
        run: python3 scripts/check_external_links.py
