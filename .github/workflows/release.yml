name: release-draft

# MANUAL ONLY. Builds the books from a tag and attaches them to a DRAFT release. A person must still
# open the draft on GitHub and press "Publish release". Prepared but not yet run (see docs/release-checklist.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v1.1"
        required: true

permissions:
  contents: read

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # only this job may create the draft release
    env:
      IMAGE: two-worlds-one-mind-build:1
      RELEASE_STATE: released
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: docker build -t "$IMAGE" .
      - run: ./scripts/check.sh
      - run: ./scripts/build.sh
      - name: Create the draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Two Worlds. One Mind. ${TAG#v}" \
            --notes-file docs/RELEASE_NOTES_1.1.md \
            dist/*.pdf dist/*.html dist/SHA256SUMS dist/manifest.json
